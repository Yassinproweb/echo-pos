{{ define "head" }}

<div class="relative w-screen h-full flex items-start justify-between gap-0 overflow-clip bg-pos_whi">

  <!-- ============ Sidebar ============ -->
  {{ template "navbar" . }}
  {{ template "topbar" . }}

  <script>
    (function () {
      const el = document.getElementById('today-date');
      if (el) {
        el.textContent = new Date().toLocaleDateString(undefined, {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
      }

      // Highlight the sidebar nav link matching the current path. Exact
      // match first; falls back to the longest href that's a prefix of
      // the current path (so e.g. /pos/order/ORD001 still highlights
      // "Order" -> /pos/orders is not a prefix of that, so this only
      // kicks in for genuine sub-routes of a nav target).
      const path = window.location.pathname;
      const links = Array.from(document.querySelectorAll('[data-nav-link]'));
      let best = links.find(a => a.getAttribute('href') === path);
      if (!best) {
        best = links
          .filter(a => path.startsWith(a.getAttribute('href')) && a.getAttribute('href') !== '/pos')
          .sort((a, b) => b.getAttribute('href').length - a.getAttribute('href').length)[0];
      }
      if (best) {
        best.classList.add('bg-pos_col', 'text-pos_whi');
        best.classList.remove('text-pos_bla/60', 'hover:bg-pos_col/10');
      }
    })();
  </script>
  {{ end }}

  {{ define "foot" }}
</div>
</body>

</html>
{{ end }}
