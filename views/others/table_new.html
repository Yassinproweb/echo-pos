<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=1367">
  <title>Point Of Sale - Add Table</title>

  {{ template "font" . }}

  <link href="/assets/hugeicons.css" rel="stylesheet">
  <link href="/assets/card.png" rel="shortcut icon" type="image/x-icon" />
  <link href="/css/output.min.css" rel="stylesheet">
</head>

<body class="bg-pos_bla w-screen aspect-[16/10] flex items-start justify-center">
  <div class="relative w-screen aspect-[16/10] bg-pos_whi overflow-y-scroll">
    {{ template "navbar" . }}

    <div class="relative w-[93%] h-full right-0 flex flex-col items-start justify-start bg-[#f5f6fa]">
      {{ template "topbar" . }}

      <div class="w-[85%] h-full flex flex-col items-center justify-center gap-5 p-5">
        <div class="w-[50] h-full flex flex-col items-center justify-center gap-5">
          <div class="w-full flex flex-col items-center justify-between gap-2.5">
            <h1 class="text-3xl text-pos_bla font-bold">Add Table</h1>
            <p>Its name (e.g. #TBL022) is generated automatically.</p>
          </div>

          {{ if .Error }}
          <div class="text-base text-pos_cld font-medium p-1 py-0.5 border-2 border-pos_cld/45 rounded bg-pos_cld/5">{{
            .Error }}</div>
          {{ end }}

          <form class="w-full flex flex-col items-start justify-start gap-5" method="POST" action="/pos/tables/new">
            <div class="w-full flex flex-col items-start justify-start gap-2.5">
              <label for="capacity" class="text-base text-pos_col font-medium">Seating capacity</label>
              <input type="number" id="capacity" name="capacity"
                class="w-full text-base text-pos_col font-medium px-3 py-2.5 rounded-lg border-2 border-pos_col/45"
                min="1" step="1" required>
            </div>

            <button type="submit" class="w-full text-base text-pos_whi font-medium px-7 py-3 rounded-lg bg-pos_col">Add
              Table</button>
          </form>

          <a href="/pos/tables" class="text-base text-pos_col font-medium underline">Back to Tables</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
