<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=1367">
  <title>Point Of Sale - Products</title>

  {{ template "font" . }}

  <!-- icons -->
  <link href="/assets/hugeicons.css" rel="stylesheet">
  <link href="/assets/card.png" rel="shortcut icon" type="image/x-icon" />

  <link href="/css/output.min.css" rel="stylesheet">

  <script src="/js/alpine.min.js" defer></script>
  <script src="/js/htmx.min.js" defer></script>
  <script src="/js/main.js" defer></script>
</head>

<body class="bg-pos_bla h-screen flex items-start justify-center">
  <div class="relative w-screen aspect-[16/10] flex items-start justify-between gap-0 bg-pos_whi overflow-y-scroll">
    <div class="w-full h-full flex flex-col gap-12">
      <div class="w-full h-full flex-col mx-auto bg-white p-4 rounded shadow">
        <div class="w-full flex items-center justify-between mb-4">
          <input type="search" id="searchInput" onkeyup="searchTable()" placeholder="Search..."
            class="w-full p-2 border border-pos_bla/25 rounded outline-none">
        </div>

        <div class="w-full h-[93%] flex flex-col gap-0.5">
          <div class="w-full flex items-center justify-between mb-3">
            <h2 class="text-pos_bla text-3xl font-bold">Products List</h2>
            <div class="flex items-center justify-end gap-3.5 shrink-0">
              <a href="/pos/reservations" class="text-pos_col font-medium underline">Reservations</a>
              <a href="/pos" class="text-pos_col font-medium underline">Back to Dashboard</a>
              <a href="/pos/logout" class="text-pos_col font-medium underline">Logout</a>
            </div>
          </div>

          <div class="w-full max-h-[93%] p-5">
            <div class="w-full grid grid-cols-6 justify-start gap-3.5">
              <a href="/pos/products/new"
                class="w-full aspect-square flex flex-col items-center justify-center gap-5 p-5 border-2 border-pos_col/45 border-dashed rounded-2xl overflow-clip bg-pos_whi">
                <i
                  class="hgi hgi-stroke hgi-plus-sign size-9 text-2xl text-pos_whi font-black flex items-center justify-center rounded-xl bg-pos_col"></i>
                <h4 class="w-full text-base text-pos_bla text-center font-semibold">Add New Products</h4>
              </a>

              {{ range .products }}
              {{ template "product_view" . }}
              {{ end }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Search functionality
    function searchTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("tbody tr");

      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
      });
    }

    // Sort functionality
    function sortTable(n) {
      const table = document.getElementById("dataTable");
      let switching = true;
      let dir = "asc";
      let switchCount = 0;

      while (switching) {
        switching = false;
        const rows = table.rows;
        for (let i = 1; i < rows.length - 1; i++) {
          let shouldSwitch = false;
          const x = rows[i].getElementsByTagName("TD")[n];
          const y = rows[i + 1].getElementsByTagName("TD")[n];
          if (dir === "asc" && x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
            shouldSwitch = true;
            break;
          } else if (dir === "desc" && x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
          switching = true;
          switchCount++;
        } else {
          if (switchCount === 0 && dir === "asc") {
            dir = "desc";
            switching = true;
          }
        }
      }
    }
  </script>
</body>

</html>
