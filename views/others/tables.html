<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=1367">
  <title>Point Of Sale - Tables</title>

  {{ template "font" . }}

  <!-- icons -->
  <link href="/assets/hugeicons.css" rel="stylesheet">
  <link href="/assets/card.png" rel="shortcut icon" type="image/x-icon" />

  <link href="/css/output.min.css" rel="stylesheet">
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->

  <script src="/js/alpine.min.js" defer></script>
  <script src="/js/htmx.min.js" defer></script>
  <script src="/js/main.js" defer></script>
</head>

<body class="bg-pos_bla h-screen flex items-start justify-center">
  <div class="relative w-screen aspect-[16/10] pb-5 bg-pos_whi">
    {{ template "navbar" . }}

    <div class="relative w-[93%] h-full right-0 flex flex-col items-start justify-start bg-[#f5f6fa]">
      {{ template "topbar" . }}

      <div class="w-full h-[90%] flex flex-col gap-5 p-5 overflow-y-scroll">
        <div class="w-full flex items-center justify-between">
          <div class="flex flex-col gap-1.5">
            <h2 class="text-pos_bla text-3xl font-bold">Manage Tables</h2>
            <div class="flex items-center gap-4 text-xs font-semibold text-pos_bla/70">
              <span class="flex items-center gap-1.5">
                <i class="size-2.5 rounded-full bg-pos_pdg"></i> Available
              </span>
              <span class="flex items-center gap-1.5">
                <i class="size-2.5 rounded-full bg-pos_rdy"></i> Reserved
              </span>
              <span class="flex items-center gap-1.5">
                <i class="size-2.5 rounded-full bg-pos_dlv"></i> On Dine
              </span>
              <span class="flex items-center gap-1.5">
                <i class="size-2.5 rounded-full bg-pos_trs"></i> Cleaning
              </span>
            </div>
          </div>

          <div
            class="w-1/3 flex items-center justify-between p-1.5 gap-5 border border-pos_col/55 rounded-full bg-pos_whi">
            <i
              class="hgi hgi-stroke hgi-search-02 text-2xl text-pos_whi shrink-0 flex items-center justify-center size-10 rounded-full bg-pos_col border border-pos_col/45"></i>

            <input type="search" id="searchInput" onkeyup="searchTable()" placeholder="Search..."
              class="w-full outline-none">
          </div>
        </div>

        <div id="tables" class="w-full grid grid-cols-5 justify-start gap-x-3.5 gap-y-6">
          <a href="/pos/tables/new"
            class="w-full aspect-square flex flex-col items-center justify-center gap-5 p-5 border-2 border-pos_col/45 border-dashed rounded-2xl overflow-clip bg-pos_whi self-center">
            <i
              class="hgi hgi-stroke hgi-plus-sign size-9 text-2xl text-pos_whi font-black flex items-center justify-center rounded-xl bg-pos_col"></i>
            <h4 class="w-full text-base text-pos_bla text-center font-semibold">Add New Table</h4>
          </a>

          {{ range .tables }}
          {{ template "table_card" . }}
          {{ end }}
        </div>
      </div>
    </div>
  </div>

  <script>
    // Search functionality
    function searchTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".table-card");

      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
      });
    }
  </script>
</body>

</html>
