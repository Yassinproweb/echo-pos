<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=1367">
  <title>Point Of Sale - Add Product</title>

  {{ template "font" . }}

  <link href="/assets/hugeicons.css" rel="stylesheet">
  <link href="/assets/card.png" rel="shortcut icon" type="image/x-icon" />
  <link href="/css/output.min.css" rel="stylesheet">

  <script src="/js/alpine.min.js" defer></script>
</head>

<body class="bg-pos_bla w-screen aspect-[16/10] flex items-start justify-center">
  <div class="relative w-screen aspect-[16/10] bg-pos_whi overflow-y-scroll">
    {{ template "navbar" . }}

    <div class="relative w-[93%] h-full right-0 flex flex-col items-start justify-start bg-[#f5f6fa]">
      {{ template "topbar" . }}

      <div class="w-full flex flex-col items-center justify-center gap-5 py-5 px-5">
        <div class="w-[55%] flex flex-col items-center justify-center gap-5">
          <div class="w-full flex flex-col items-center justify-center gap-2.5">
            <h1 class="text-2xl text-pos_bla font-bold">Add Product</h1>
            <p class="text-base text-pos_pdg text-center">Add a new item to the menu.</p>
          </div>

          {{ if .Error }}
          <div class="ext-error">{{ .Error }}</div>
          {{ end }}

          <form class="w-full flex flex-col items-start justify-start gap-5" method="POST" action="/pos/products/new"
            enctype="multipart/form-data">
            <div class="w-full flex flex-col items-start justify-start gap-2.5">
              <label class="text-base text-pos_bla font-medium" for="name">Product name</label>
              <input class="w-full text-base text-pos_bla font-medium px-3 py-2.5 rounded-lg border-2 border-pos_bla/75"
                type="text" id="name" name="name" placeholder="e.g. Vegetable Pizza" required>
            </div>

            <div class="w-full flex flex-col items-start justify-start gap-2.5">
              <label class="text-base text-pos_bla font-medium" for="description">Description</label>
              <textarea id="description" name="description" rows="3"
                class="w-full text-base text-pos_bla font-medium px-3 py-2.5 rounded-lg border-2 border-pos_bla/75"
                required></textarea>
            </div>

            <div class="w-full flex flex-col items-start justify-start gap-2.5">
              <label class="text-base text-pos_bla font-medium" for="price">Price (UGX)</label>
              <input class="w-full text-base text-pos_bla font-medium px-3 py-2.5 rounded-lg border-2 border-pos_bla/75"
                type="number" id="price" name="price" min="0" step="500" required>
            </div>

            <div class="w-full flex flex-col items-start justify-start gap-2.5">
              <label class="text-base text-pos_bla font-medium" for="image_file">Upload image</label>
              <input class="w-full text-base text-pos_bla font-medium px-3 py-2.5 rounded-lg border-2 border-pos_bla/75"
                type="file" id="image_file" name="image_file" accept="image/*">
            </div>

            <div class="w-full flex flex-col items-start justify-start gap-2.5">
              <label class="text-base text-pos_bla font-medium" for="image">...or image path/URL</label>
              <input disabled
                class="w-full text-base text-pos_bla font-medium px-3 py-2.5 rounded-lg border-2 border-pos_bla/35"
                type="text" id="image" name="image" placeholder="/assets/imgs/my-dish.jpg">
              <span class="ext-hint">Only needed if you didn't upload a file above.</span>
            </div>

            <button type="submit" class="w-full text-base text-pos_whi font-medium px-7 py-3 rounded-lg bg-pos_col">Add
              Product</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
